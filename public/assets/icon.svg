<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d8f6f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>

  <!-- Book Icon -->
  <g transform="translate(256, 256) scale(0.8)">
    <!-- Open Book -->
    <path d="M-120,-60 Q-60,-80 0,-60 Q60,-80 120,-60 L120,80 Q60,60 0,80 Q-60,60 -120,80 Z"
          fill="white" opacity="0.9"/>

    <!-- Center Spine -->
    <path d="M0,-60 L0,80" stroke="#1a5f4a" stroke-width="3" opacity="0.5"/>

    <!-- Left Page Lines -->
    <path d="M-100,-40 L-10,-35" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M-100,-20 L-10,-15" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M-100,0 L-10,5" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M-100,20 L-10,25" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M-100,40 L-10,45" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>

    <!-- Right Page Lines -->
    <path d="M100,-40 L10,-35" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M100,-20 L10,-15" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M100,0 L10,5" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M100,20 L10,25" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
    <path d="M100,40 L10,45" stroke="#1a5f4a" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Arabic Text (Ayah) -->
  <text x="256" y="380"
        font-family="'Amiri', serif"
        font-size="48"
        fill="white"
        text-anchor="middle"
        opacity="0.95">آية</text>

  <!-- Decorative Stars -->
  <circle cx="150" cy="120" r="8" fill="#c9a227" opacity="0.8"/>
  <circle cx="362" cy="120" r="8" fill="#c9a227" opacity="0.8"/>
  <circle cx="256" cy="90" r="10" fill="#c9a227" opacity="0.9"/>
</svg>
